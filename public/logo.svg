<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#c9a05c"/>
      <stop offset="100%" stop-color="#7c4f1a"/>
    </linearGradient>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#2c2418"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="48" fill="url(#logo-bg)" stroke="url(#logo-gold)" stroke-width="2"/>

  <!-- 善缘堂 - 莲台 + 心形组合 -->
  <g transform="translate(50,46)">
    <!-- 莲台基座 -->
    <ellipse cx="0" cy="18" rx="24" ry="6" fill="url(#logo-gold)" opacity="0.3"/>
    <path d="M-20 18 C-20 5 -22 -5 0 -2 C22 -5 20 5 20 18" fill="url(#logo-gold)" opacity="0.5"/>

    <!-- 心形善缘 -->
    <g transform="translate(0,-14)">
      <path d="M0 8 C-10 -2 -20 -8 -20 -2 C-20 6 -8 16 0 24 C8 16 20 6 20 -2 C20 -8 10 -2 0 8Z"
        fill="url(#logo-gold)" opacity="0.9"/>
      <!-- 中心火焰 -->
      <circle cx="0" cy="5" r="3" fill="#fff7c0"/>
    </g>

    <!-- 光晕 -->
    <circle cx="0" cy="0" r="30" fill="url(#logo-gold)" opacity="0.08"/>
  </g>
</svg>
