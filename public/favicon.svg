<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C2418"/>
      <stop offset="100%" stop-color="#1A1410"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#C9A05C"/>
      <stop offset="100%" stop-color="#7C4F1A"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
  <!-- 莲花简化图案 -->
  <g transform="translate(50,50)" fill="none" stroke="url(#gold)" stroke-width="1.5">
    <!-- 花瓣 -->
    <ellipse cx="0" cy="-20" rx="10" ry="18" opacity="0.8"/>
    <ellipse cx="17" cy="-10" rx="10" ry="18" transform="rotate(60)" opacity="0.8"/>
    <ellipse cx="17" cy="10" rx="10" ry="18" transform="rotate(120)" opacity="0.8"/>
    <ellipse cx="0" cy="20" rx="10" ry="18" transform="rotate(180)" opacity="0.8"/>
    <ellipse cx="-17" cy="10" rx="10" ry="18" transform="rotate(240)" opacity="0.8"/>
    <ellipse cx="-17" cy="-10" rx="10" ry="18" transform="rotate(300)" opacity="0.8"/>
    <!-- 中心火焰 -->
    <circle cx="0" cy="0" r="5" fill="url(#gold)" opacity="0.6"/>
    <circle cx="0" cy="-3" r="3" fill="#FDE68A" opacity="0.9"/>
  </g>
</svg>
