<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="50%" stop-color="#2C2418"/>
      <stop offset="100%" stop-color="#1A1410"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#C9A05C"/>
      <stop offset="100%" stop-color="#7C4F1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A05C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A05C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- 光晕 -->
  <ellipse cx="600" cy="250" rx="350" ry="250" fill="url(#glow)"/>

  <!-- 中式纹样装饰 -->
  <g stroke="#C9A05C" stroke-width="0.8" fill="none" opacity="0.2">
    <line x1="300" y1="100" x2="900" y2="100"/>
    <line x1="350" y1="530" x2="850" y2="530"/>
    <circle cx="600" cy="100" r="3" fill="#C9A05C"/>
    <circle cx="600" cy="530" r="3" fill="#C9A05C"/>
  </g>

  <!-- 主标题 -->
  <text x="600" y="280" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="72" fill="url(#gold-grad)" letter-spacing="12">菩提苑</text>

  <!-- 副标题 -->
  <text x="600" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#D4C8B0" letter-spacing="6">为家人祈福求灵签</text>

  <!-- 底部文字 -->
  <text x="600" y="480" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#C9A05C" opacity="0.7">心诚则灵 · 一念慈悲 · 福报自来</text>

  <!-- 底部装饰线 -->
  <line x1="450" y1="510" x2="750" y2="510" stroke="#C9A05C" stroke-width="1" opacity="0.4"/>
  <circle cx="600" cy="510" r="4" fill="#C9A05C" opacity="0.5"/>
</svg>
